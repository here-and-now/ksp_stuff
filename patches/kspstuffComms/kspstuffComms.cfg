// kspstuffComms — last-write RealAntennas ground + minRelayTL.
// Do not edit RealAntennas or RSS; CKAN would wipe it.
// AFTER[zRealAntennas] so RA L omnis already exist on every City2.
//
// Default L TechLevel 3 (silent until commsTL3 / basicScience).
// Cape + Wallops + Bermuda stay TechLevel 0.
// DSN L array 20 → 8 dBi until commsTL4 / electrics.
// S/X/K DSN left as RA gates them. Do not touch craft ModuleRealAntenna.

@RealAntennasCommNetParams:NEEDS[RealAntennas]:AFTER[zRealAntennas]
{
	@minRelayTL = 3
}

@Kopernicus:NEEDS[RealAntennas,Kopernicus]:AFTER[zRealAntennas]
{
	@Body[Kerbin]
	{
		@PQS
		{
			@Mods
			{
				@City2[*TrackingStation],*
				{
					@Antenna:HAS[#RFBand[L]],*
					{
						@TechLevel = 3
					}
				}
				@City2[CanaveralTrackingStation]
				{
					@Antenna:HAS[#RFBand[L]],*
					{
						@TechLevel = 0
					}
				}
				// MM forbids spaces inside []. ? is one character (RA/RO same trick).
				@City2[*TrackingStation]:HAS[#objectName[US?-?Wallops]]
				{
					@Antenna:HAS[#RFBand[L]],*
					{
						@TechLevel = 0
					}
				}
				@City2[*TrackingStation]:HAS[#objectName[MSFN?-?BDA?Bermuda]]
				{
					@Antenna:HAS[#RFBand[L]],*
					{
						@TechLevel = 0
					}
				}
				@City2[DSNTrackingStation],*
				{
					@Antenna:HAS[#RFBand[L]],*
					{
						@TechLevel = 0
						@referenceGain = 8
						UPGRADE
						{
							TechLevel = 4
							referenceGain = 20
						}
					}
				}
			}
		}
	}
}
