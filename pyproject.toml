[project]
name = "kspstuff"
version = "0.2.0"
description = "kRPC helpers for KSP. Run python main.py; not a pip package."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "os" }]
dependencies = [
    "krpc",
]

# Application checkout, not a pip package. Runtime: krpc. Tests: pytest.
[dependency-groups]
dev = ["pytest>=8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
