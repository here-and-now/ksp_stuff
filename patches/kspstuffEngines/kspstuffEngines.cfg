// kspstuffEngines — ReStockPlus liquids: ModuleEnginesRF + ullage + ignitions
// + Waterfall engineID bind. FINAL after RF-Stockalike and WaterfallRestock.
// Skip SRBs (ullage N/A) and LES (solid). Not ROEngines.
//
// Ignitions (fair, not RP-1):
//   1  first-stage / booster kerolox (Valiant, Caravel, Galleon, Boar)
//   2  mid/sustainer (Ursa)
//   4  restartable upper / small / NTR (Pug, Torch, Schnauzer, Panda, Cherenkov)
//   8  vacuum cluster (Corgi)
// Pad 1 g still lights. Coast relight spends an ignition and needs settle.
// MM: every key=value on its own line. One-line PROPELLANT/atmosphereCurve
// concatenates into the first key and PartLoader GetInfo NREs.

@PART[restock-engine-125-valiant]:NEEDS[RealFuels,SolverEngines]:FINAL
{
	@MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesRF
		%engineID = basicEngine
		%ullage = true
		%ignitions = 1
		%pressureFed = false
	}
	!MODULE[ModuleEngineConfigs] {}
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesRF
		techLevel = 1
		origTechLevel = 1
		engineType = L
		origMass = 0.75
		configuration = Kerosene+LqdOxygen
		modded = false
		ullage = true
		ignitions = 1
		CONFIG
		{
			name = Kerosene+LqdOxygen
			maxThrust = 100
			heatProduction = 200
			throttle = 0
			ignitions = 1
			ullage = true
			pressureFed = false
			PROPELLANT
			{
				name = Kerosene
				ratio = 0.9
				DrawGauge = True
				resourceFlowMode = STACK_PRIORITY_SEARCH
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 1.1
				resourceFlowMode = STACK_PRIORITY_SEARCH
			}
			atmosphereCurve
			{
				key = 0 270
				key = 1 240
				key = 7 0.001
			}
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 2
			}
		}
	}
}

