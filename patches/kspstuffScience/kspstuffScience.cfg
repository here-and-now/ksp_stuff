// kspstuffScience — last-write Kerbalism experiment caps.
// Do not edit KerbalismConfig; CKAN would wipe it.
// AFTER[zzzKerbalismDefault] so scienceCap = baseValue has already run.
//
// barometerScan 9 → 3   (PresMat, stability 18: biome spray)
// mobileMaterialsLab 18 → 6   (Science Jr, basicScience 45: six global sits)
// atmosphereAnalysis 16 → 6   (Spectro, aerodynamicSystems 90: 18 s sample)
//
// Leave MITE/SITE/BEEP/grav/seismic/WING/CLOUD. Polar and clocks stay.

@KERBALISM_EXPERIMENT_VALUES:NEEDS[FeatureScience]:AFTER[zzzKerbalismDefault]
{
	@STOCK
	{
		@barometerScan
		{
			@value = 3
		}
		@mobileMaterialsLab
		{
			@value = 6
		}
		@atmosphereAnalysis
		{
			@value = 6
		}
	}
}

@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]:NEEDS[FeatureScience]:AFTER[zzzKerbalismDefault]
{
	@baseValue = 3
	@scienceCap = 3
}

@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]:NEEDS[FeatureScience]:AFTER[zzzKerbalismDefault]
{
	@baseValue = 6
	@scienceCap = 6
}

@EXPERIMENT_DEFINITION:HAS[#id[atmosphereAnalysis]]:NEEDS[FeatureScience]:AFTER[zzzKerbalismDefault]
{
	@baseValue = 6
	@scienceCap = 6
}
